<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Magnata — tabuleiro online com os amigos</title>
  <meta name="theme-color" content="#0d1530" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============ HOME ============ -->
  <section id="home" class="screen">
    <div class="home-card">
      <div class="logo-wrap">
        <div class="logo-hat">🎩</div>
        <h1 class="logo">MAGNATA</h1>
        <p class="tag">Compre cidades, cobre aluguel e leve seus amigos à falência.</p>
      </div>
      <label class="field">
        <span>Seu nome</span>
        <input id="nameInput" maxlength="16" placeholder="Ex.: João" autocomplete="nickname" />
      </label>
      <div class="field">
        <span>Cor do peão</span>
        <div class="color-pick" id="colorPick"></div>
      </div>
      <button id="createBtn" class="btn primary big">Criar sala</button>
      <div class="divider"><span>ou entre numa sala</span></div>
      <div class="join-row">
        <input id="codeInput" placeholder="CÓDIGO" maxlength="6" autocomplete="off" />
        <button id="joinBtn" class="btn">Entrar</button>
      </div>
    </div>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="screen hidden">
    <div class="lobby-card">
      <p class="eyebrow">Sala</p>
      <div class="room-code" id="roomCode">----</div>
      <button id="copyLink" class="btn ghost">📋 Copiar link de convite</button>
      <ul class="lobby-players" id="lobbyPlayers"></ul>
      <p class="lobby-hint" id="lobbyHint"></p>
      <button id="startBtn" class="btn primary big">Começar partida</button>
      <button id="leaveBtn" class="btn ghost small">Sair da sala</button>
    </div>
  </section>

  <!-- ============ JOGO ============ -->
  <section id="game" class="screen hidden">
    <div class="game-layout">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board">
          <div class="center" id="center">
            <div class="center-logo">MAGNATA</div>
            <div class="turn-label" id="turnLabel"></div>
            <div class="dice-area">
              <div class="die" id="die0"><div class="cube"></div></div>
              <div class="die" id="die1"><div class="cube"></div></div>
            </div>
            <div class="actions" id="actions"></div>
          </div>
          <div class="tokens" id="tokens"></div>
          <div class="fx" id="fx"></div>
        </div>
      </div>

      <aside class="side">
        <div class="side-top">
          <span class="room-pill" id="roomPill">Sala ----</span>
          <span class="round-pill" id="roundPill"></span>
          <span class="spacer"></span>
          <button class="icon-btn" id="rulesBtn" title="Regras">❔</button>
          <button class="icon-btn" id="muteBtn" title="Som">🔊</button>
        </div>
        <div class="players" id="players"></div>
        <div class="tool-row" id="toolRow">
          <button class="btn small" id="tradeBtn">🤝 Negociar</button>
          <button class="btn small" id="myPropsBtn">🏘️ Meus imóveis</button>
          <button class="btn small danger-ghost" id="quitBtn">🏳️ Desistir</button>
        </div>
        <div class="emotes" id="emotes"></div>
        <div class="tabs">
          <button class="tab active" data-tab="log">Histórico</button>
          <button class="tab" data-tab="chat">Chat <span class="badge hidden" id="chatBadge">0</span></button>
        </div>
        <div class="panel" id="logPanel"><ul id="logList"></ul></div>
        <div class="panel hidden" id="chatPanel">
          <ul id="chatList"></ul>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" maxlength="200" placeholder="Mande uma mensagem…" autocomplete="off" />
            <button class="btn small primary">Enviar</button>
          </form>
        </div>
      </aside>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="cardOverlay" class="card-overlay hidden">
    <div class="game-card" id="gameCard">
      <div class="gc-inner">
        <div class="gc-back"><span id="gcBackIcon">❓</span></div>
        <div class="gc-front">
          <div class="gc-deck" id="gcDeck">SORTE</div>
          <div class="gc-icon" id="gcIcon">❓</div>
          <div class="gc-text" id="gcText"></div>
          <div class="gc-who" id="gcWho"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="conn" class="conn hidden">Reconectando…</div>
  <div id="toasts" class="toasts"></div>
  <canvas id="confetti"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
